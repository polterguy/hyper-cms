# Zips the site and publishes it to the Bazar as a frontend plugin.

name: Publish to the Bazar
on:
  push:
    branches: [ master, main ]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # There is no build step, and no dist folder to archive. A frontend
      # plugin is unzipped straight into "/etc/www/", so the repository root
      # IS the web root and the archive's entries have to sit at its root with
      # nothing wrapping them.
      #
      # Everything belonging to the repository rather than to the site is left
      # out here rather than deleted from the checkout first, so that one step
      # decides what ships. The README goes too — it is uploaded separately
      # below, as the plugin's description.
      - name: Archive
        run: >
          zip -r ./${{ github.event.repository.name }}.zip .
          -x '.git/*' '.github/*' '.vscode/*' '.gitignore' 'README.md'

      - name: Publish
        if: success()
        uses: fjogeleit/http-request-action@v1.14.0
        with:
          url: 'https://ainiro.io/magic/system/file-system/file'
          method: 'PUT'
          timeout: 50000
          customHeaders: '{
            "Content-Type": "multipart/form-data",
            "Authorization": "Bearer ${{ secrets.TOKEN }}"
            }'
          data: '{"folder": "/etc/bazar/frontends/"}'
          files: '{"file": "./${{ github.event.repository.name }}.zip"}'

      - name: Uploading description
        if: success()
        uses: fjogeleit/http-request-action@v1.14.0
        with:
          url: 'https://ainiro.io/magic/system/file-system/file'
          method: 'PUT'
          timeout: 50000
          customHeaders: '{
            "Content-Type": "multipart/form-data",
            "Authorization": "Bearer ${{ secrets.TOKEN }}"
            }'
          data: '{"folder": "/etc/bazar/frontends/"}'
          files: '{"file": "./README.md"}'

      - name: Renaming description file
        if: success()
        uses: fjogeleit/http-request-action@v1.14.0
        with:
          url: 'https://ainiro.io/magic/system/file-system/rename'
          method: 'POST'
          timeout: 50000
          customHeaders: '{
            "Content-Type": "application/json",
            "Authorization": "Bearer ${{ secrets.TOKEN }}"
            }'
          data: '{
            "oldName": "/etc/bazar/frontends/README.md",
            "newName": "${{ github.event.repository.name }}.md"
            }'
